; reTerminal E1001 standalone dashboard firmware
;
; Platform: pioarduino fork of platform-espressif32 (Arduino core 3.x over ESP-IDF 5.x).
; Pinned release URL for reproducible builds - do not float "espressif32".

[env:e1001]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.31/platform-espressif32.zip
framework = arduino
board = esp32-s3-devkitc-1
; The chip has 32MB, but only the first 8MB are used (see partitions_8mb.csv):
; the prebuilt core has no >16MB quad-flash addressing; Seeed's guide uses 8MB.
board_upload.flash_size = 8MB
board_build.partitions = partitions_8mb.csv
; Flash boot_app0.bin (initial otadata) where this table's otadata really is.
; The core's default 0xe000 lands inside our NVS, and USB uploads would then
; neither reset the boot slot (after an OTA the old image kept booting) nor
; leave NVS intact.
board_upload.arduino.boot_app0 = 0x29000
; Quad (QIO) flash + octal PSRAM, matching Seeed's "XIAO_ESP32S3 + OPI PSRAM".
; If the device boot-loops at startup, try opi_opi or qio_qspi here.
board_build.arduino.memory_type = qio_opi
; roots.pem: TLS trust store. ota_signing_pub.pem: the only key OTA images may be signed with.
board_build.embed_txtfiles =
    certs/roots.pem
    certs/ota_signing_pub.pem
extra_scripts = post:scripts/factory_image.py
build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=2
    -Wall
monitor_speed = 115200
lib_deps =
    zinggjm/GxEPD2 @ ^1.6.4
    olikraus/U8g2_for_Adafruit_GFX @ ^1.8.0
    bblanchon/ArduinoJson @ ^7.4.2
    adafruit/RTClib @ ^2.1.4

; Host-side unit tests for the pure derive/model logic in lib/dashcore.
; Requires a native C++ toolchain (gcc/mingw) on the build host.
[env:native]
platform = native
test_framework = unity
build_flags = -std=c++17
lib_deps =
    bblanchon/ArduinoJson @ ^7.4.2
